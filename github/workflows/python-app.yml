name:Student ML CI-CD Pipeline

on:
  push:
      branches:
         - main

  pull_request:
      branches:
          - main

jobs:
    test-and-build:
         name:Test and Build ML Application
         runs-on:ubuntu-latest 
         steps:
            - name:Chechout Code  
              uses:actions/checkout@v4
            - name:Setup Python
              uses:action/setup-python@v5

              with:
                python-version: "3.10" 
            - name:Install Dependencies
              run:pip install -r requirements.txt
            - name:Train ML Model
              run:python ml/train.py  
              